<!DOCTYPE html> 
<html> 
    <head>  
        <title>CSS Backgrounds</title>  
        <style>      
           .box1 
           { 
            width: 300px; 
            height: 150px; 
            background-color: lightblue; 
           }         
            .box4 
            {      
                 width: 300px; 
                 height: 150px;     
                 background-image: url("images/banner.jpg");    
                 background-repeat: no-repeat;       
                 background-position: center;   
            }       
            .box5 {       
                width: 100%; height: 300px;       
                background-image: url("images/banner.jpg");       
                background-size: cover;      
                background-position: center;    
            }        
            .box9 {
                width: 300px;
                height: 150px; 
                background: linear-gradient(red, blue); 
            }          
            .box10 {
                width: 300px;
                height: 150px; 
                background: radial-gradient(red, blue);
            }   
        </style>
     </head>
     <body>   
        <h1>CSS Background Examples</h1>   
        <div class="box1">Background Color</div><br> 
        <p>CodeExpert Technology CSS Notes</p>
        <div class="box4">Background Position</div><br> 
        <div class="box5">Background Size - Cover</div><br> 
        <div class="box9">Linear Gradient</div><br> 
        <div class="box10">Radial Gradient</div> 
    </body> 
</html>
